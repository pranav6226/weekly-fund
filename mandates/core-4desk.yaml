# core-4desk: the v3 mandate. Four desks, one per data source, fused by the
# Jev-shaped judgment layer.
#
# Desk weights are DOCUMENTED PRIORS set once from economic reasoning, not
# fit to backtests (same discipline as v2.1). Rationale:
#   technicals 0.40 -- price/volume is the only data with a clean 6-year
#     point-in-time history today; it carries the proven momentum edge.
#   fundamentals 0.30 -- value/quality/earnings drift is the classic
#     complement to momentum (different holding horizons, different regimes).
#   filings 0.15 -- earnings drift + filing attention from free EDGAR 8-Ks.
#     Noisy like news attention was, sized as a diversifier, not a driver.
#   macro 0.15 -- portfolio-level regime input, not per-ticker stock picking.
#     Blends with (not replaces) the price-based regime factor.
#
# Tickers are NEVER named here -- supply the universe per run.
schema_version: 1
name: core-4desk

desks:
  - name: technicals
    weight: 0.40
    params:
      # qualvol stays excluded: anti-signal in both regimes in this
      # universe (v2.1 decile diagnostics, t=-9.1). Revisit only with
      # a broader, survivorship-free universe.
      agents: [trend, reversal, flow]
      w_trend: 0.55
      w_reversal: 0.20
      w_flow: 0.25

  - name: fundamentals
    weight: 0.30
    params:
      metrics_periods: 8        # annual 10-K rows, filing-date-gated
      value_weight: 0.40        # earnings yield + FCF yield
      quality_weight: 0.35      # ROE + gross margin
      growth_weight: 0.25       # YoY EPS growth

  - name: filings
    weight: 0.15
    params:
      pead_window_days: 21      # post-earnings drift signal window (calendar days)
      pead_cap: 2.0             # cap |2d CAR|/4% so one blowout can't dominate
      pead_weight: 0.6          # drift vs attention inside the desk
      attn_weight: 0.4
      attn_lookback_days: 63    # attention window
      attn_baseline_days: 252   # baseline for abnormal filing rate

  - name: macro
    weight: 0.15
    params:
      # 0 = price regime only, 1 = macro regime only. 0.5 = equal blend.
      blend_with_price_regime: 0.5

fusion:
  method: regime_aware

risk:
  max_position_weight: 0.08
  max_sector_weight: 0.30
  max_positions: 20
  stop_loss: 0.10
  max_hold_days: 84
  regime_floor: 0.5

capital: 100000.0
rebalance: weekly
benchmark: SPY
